# Les variables NEXT_PUBLIC_* sont publiques : Next.js les inscrit dans le
# JavaScript envoyé au navigateur. Le cache Turbopack les contient aussi pendant
# le build, et ce cache n’est pas publié. On n’exclut pas les secrets serveur.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".next/cache,.next/dev"
